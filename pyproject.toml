[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.2.0"
description = "Tether: a runtime for long-running coding agents — LLM-driven tool loop, three-layer memory, budgeted context compression, drift-aware recovery"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tether Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
tether = "tether.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tether = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (common bugs)
    "UP",  # pyupgrade
]
ignore = [
    "E501", # long lines in prompts/docstrings are fine; formatter not enforced
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
