[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
dynamic = ["version"]
description = "Tether: a runtime for long-running coding agents — LLM-driven tool loop, three-layer memory, budgeted context compression, drift-aware recovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "223456png", email = "147728607+223456png@users.noreply.github.com" },
]
keywords = [
    "ai-agent",
    "llm-agent",
    "context-window",
    "context-compression",
    "agent-memory",
    "mcp",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/223456png/tether"
Repository = "https://github.com/223456png/tether"
Issues = "https://github.com/223456png/tether/issues"
Changelog = "https://github.com/223456png/tether/blob/main/CHANGELOG.md"

[project.scripts]
tether = "tether.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tether.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tether = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (common bugs)
    "UP",  # pyupgrade
]
ignore = [
    "E501", # long lines in prompts/docstrings are fine; formatter not enforced
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tether"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
